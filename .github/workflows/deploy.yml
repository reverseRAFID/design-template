name: Deploy

# Builds the brand kit and publishes it to GitHub Pages.
#
# One-time setup in the repo: Settings → Pages → Source = "GitHub Actions".
# Nothing else to configure; there are no secrets and no environment variables,
# because the app is entirely client-side.
on:
  push:
    branches: [main]
  # So a broken build is caught on the PR rather than after merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time, and cancel superseded pushes — but never cancel a run
  # that is already publishing.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same three gates as local development, in the same order.
      - name: Lint (includes the no-pure-white check)
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        # A project site is served from /<repo>/, so the base has to match or
        # every asset URL 404s. See docs/DECISIONS.md D6.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # Pull requests build and test, but only main publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
